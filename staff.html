<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 經采家庭日｜工作人員計分</title>
<style>
  :root{
    --paper:#faf8f3; --card:#ffffff; --ink:#2a2f38; --sub:#7c8390; --line:#e7e2d6;
    --tt:#f76707; --bad:#2f9e44; --bb:#c2402a; --gold:#c8951f; --red:#c0392b; --white-team:#4a6076;
    /* 各賽事分組色：同一運動用同色系，深淺／冷暖區隔，方便現場一眼分辨 */
    --g-tm:#f76707; --g-tw:#d6336c;                    /* 桌球：男單橘、女單桃紅（避免與籃球磚紅混淆） */
    --g-bm:#2f9e44; --g-bw:#0ca678; --g-bx:#74b816;    /* 羽球：男雙綠、女雙青綠、混雙黃綠 */
    --g-bb:#c2402a;                                    /* 籃球 */
    --ok:#2f9e44;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:50px; user-select:none;
  }

  /* PIN 鎖定畫面 */
  #lockScreen{
    position:fixed; inset:0; background:var(--paper); z-index:50;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:24px;
  }
  #lockScreen h2{margin:0; font-size:19px;}
  #lockScreen p{margin:0; color:var(--sub); font-size:13px; text-align:center;}
  #pinInput{
    font-size:28px; letter-spacing:10px; text-align:center; width:200px;
    border:2px solid var(--line); border-radius:12px; padding:12px 10px; font-family:inherit;
  }
  #pinInput:focus{outline:none; border-color:var(--gold);}
  #pinBtn{
    font-size:16px; font-weight:800; color:#fff; background:var(--ink); border:none;
    border-radius:12px; padding:12px 32px;
  }
  #pinErr{color:var(--red); font-size:13px; height:16px;}

  header{
    padding:14px 16px 0; border-bottom:1px solid var(--line); background:var(--paper);
    position:sticky; top:0; z-index:6;
  }
  h1{margin:0; font-size:17px; font-weight:800;}
  .sub{color:var(--sub); font-size:12px; margin-top:3px; padding-bottom:10px;}

  .nav{display:flex; gap:4px; padding:0 10px; background:var(--paper); position:sticky; top:48px; z-index:6; border-bottom:1px solid var(--line);}
  .navtab{flex:1; text-align:center; font-size:13.5px; font-weight:700; color:var(--sub); padding:10px 2px 9px; border-bottom:3px solid transparent; cursor:pointer;}
  .navtab.active{color:var(--ink); border-bottom-color:var(--gold);}

  .searchrow{padding:10px 16px 0;}
  #q, #sq{width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:15px; font-family:inherit;}
  #q:focus, #sq:focus{outline:none; border-color:var(--gold);}
  .chips{display:flex; gap:8px; padding:10px 16px 12px; overflow-x:auto;}
  .chip{flex:none; font-size:13.5px; font-weight:700; padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--sub); white-space:nowrap;}
  .chip.active{color:#fff; border-color:transparent;}
  .chip[data-s="all"].active{background:#3a4250;}
  .chip[data-s="tt"].active{background:var(--tt);}
  .chip[data-s="bad"].active{background:var(--bad);}
  .chip[data-s="bb"].active{background:var(--bb);}
  .chip[data-s="live"]{color:var(--gold); border-color:#e6d6a8;}
  .chip[data-s="live"].active{background:var(--gold); color:#fff;}
  .chip[data-s="next"]{color:#5b7ba6; border-color:#cfd8e3;}
  .chip[data-s="next"].active{background:#5b7ba6; color:#fff;}
  #shootChips .chip.active{background:#3a4250;}
  #shootChips .chip[data-sf="top4"]{color:var(--gold); border-color:#e6d6a8;}
  #shootChips .chip[data-sf="top4"].active{background:var(--gold); color:#fff; border-color:transparent;}
  .chip .cnt{margin-left:5px; font-size:11.5px; opacity:.75; font-variant-numeric:tabular-nums;}

  main{padding:4px 16px 0;}
  .empty{text-align:center; color:var(--sub); padding:40px 20px; font-size:14px;}
  .updated{text-align:center; color:var(--sub); font-size:11.5px; padding:16px 0 4px;}
  .verline{text-align:center; color:var(--sub); font-size:10.5px; padding:0 0 16px; opacity:.75;}

  .card{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:10px;}
  .card.tt{border-left-color:var(--tt);}
  .card.bad{border-left-color:var(--bad);}
  .card.bb{border-left-color:var(--bb);}
  .card.g-tm{border-left-color:var(--g-tm);}
  .card.g-tw{border-left-color:var(--g-tw);}
  .card.g-bm{border-left-color:var(--g-bm);}
  .card.g-bw{border-left-color:var(--g-bw);}
  .card.g-bx{border-left-color:var(--g-bx);}
  .card.g-bb{border-left-color:var(--g-bb);}
  .card.qual{border-left-color:var(--gold);}
  .ctop{font-size:12px; font-weight:700; color:var(--sub); display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
  .ctop .tag{font-weight:700;}
  .card.tt .ctop .tag{color:var(--tt);}
  .card.bad .ctop .tag{color:var(--bad);}
  .card.bb .ctop .tag{color:var(--bb);}
  .card.g-tm .ctop .tag{color:var(--g-tm);}
  .card.g-tw .ctop .tag{color:var(--g-tw);}
  .card.g-bm .ctop .tag{color:var(--g-bm);}
  .card.g-bw .ctop .tag{color:var(--g-bw);}
  .card.g-bx .ctop .tag{color:var(--g-bx);}
  .card.g-bb .ctop .tag{color:var(--g-bb);}
  .cvenue{font-size:11px; color:var(--sub); margin-top:1px;}

  .scorerow{display:flex; align-items:center; justify-content:space-between; padding:9px 0 2px; gap:8px;}
  .scorerow .pname{flex:1; min-width:0; font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stepper{display:flex; align-items:center; gap:0; flex:none;}
  .stepbtn{
    width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-size:20px; font-weight:800; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .stepbtn:active{background:#f0ece2;}
  .stepval{
    width:50px; text-align:center; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;
    border:1.5px solid transparent; border-radius:8px; background:transparent; color:var(--ink);
    padding:6px 2px; font-family:inherit; -moz-appearance:textfield;
  }
  .stepval::-webkit-outer-spin-button, .stepval::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .stepval::placeholder{color:var(--sub); font-weight:600; font-size:14px;}
  .stepval:focus{outline:none; border-color:var(--gold); background:#fff;}

  .cardfoot{display:flex; justify-content:flex-end; margin-top:4px;}
  .clearlink{font-size:11.5px; color:var(--sub); text-decoration:underline; padding:4px;}
  .savedtag{font-size:11px; color:var(--ok); font-weight:700;}

  .qualtag{font-size:10.5px; background:var(--gold); color:#fff; border-radius:6px; padding:1px 6px; margin-left:4px;}
  /* 同分待加賽／預賽未登記完的暫定名次 */
  .qualtag.tie{background:var(--red);}
  .qualtag.pend{background:var(--sub);}
  .card.tiecard{border-left-color:var(--red); background:#fff7f5;}
  .tiebar{
    background:#fff7f5; border:1.5px solid var(--red); color:var(--red);
    border-radius:10px; padding:9px 12px; margin-bottom:10px; font-size:13px; font-weight:700; line-height:1.5;
  }

  /* 裁判姓名加粗，讓現場工作人員一眼看到自己是不是這場的裁判 */
  .cvenue b{color:var(--ink); font-weight:800;}

  /* 勝者獎盃：名字太長時只截斷名字，獎盃永遠看得到 */
  .scorerow .pname{display:flex; align-items:center; gap:3px; overflow:visible;}
  .pntxt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pnwin{flex:none;}
  .fwin{flex:none; color:var(--gold); font-weight:800; white-space:nowrap; font-size:13px;}

  /* 進行中／下一場 */
  .card.live{background:#fffdf2; border-top-color:#f0d98a; border-right-color:#f0d98a; border-bottom-color:#f0d98a;}
  .card.next{border-top-style:dashed; border-right-style:dashed; border-bottom-style:dashed;}
  .phasetag{font-size:11px; font-weight:800; white-space:nowrap;}
  .phasetag.live{color:var(--gold);}
  .phasetag.live.over{color:var(--red);}
  .phasetag.next{color:#5b7ba6;}
</style>
</head>
<body>

<div id="lockScreen">
  <h2>🔒 工作人員計分</h2>
  <p>此頁面僅供工作人員輸入比分使用<br>請輸入現場提供的通關密碼</p>
  <input id="pinInput" inputmode="numeric" maxlength="8" placeholder="••••">
  <div id="pinErr"></div>
  <button id="pinBtn">確認進入</button>
</div>

<header>
  <h1>✏️ 工作人員計分</h1>
  <div class="sub">點數字兩側的按鈕即可，會自動同步</div>
</header>

<div class="nav" id="nav">
  <div class="navtab active" data-v="schedule">🗓 賽程比分</div>
  <div class="navtab" data-v="fun">🎯 趣味競賽</div>
  <div class="navtab" data-v="shoot">🏀 投籃大賽</div>
</div>

<div id="scheduleControls">
  <div class="searchrow"><input id="q" placeholder="搜尋姓名／英文名／員編"></div>

    <div class="chip" data-s="live">● 進行中</div>
    <div class="chip" data-s="next">○ 下一場</div>

    <div class="chip" data-s="tt">🏓 桌球</div>
    <div class="chip" data-s="bad">🏸 羽球</div>
    <div class="chip" data-s="bb">🏀 籃球</div>
  </div>
</div>

<div id="shootControls" style="display:none">
  <div class="searchrow"><input id="sq" placeholder="搜尋姓名／英文名／員編"></div>
  <div class="chips" id="shootChips">
    <div class="chip active" data-sf="all">全部</div>
    <div class="chip" data-sf="top4">🏆 前 4 名</div>
  </div>
</div>

<main id="main"></main>
<div class="updated" id="updated"></div>
<div class="verline" id="verline"></div>
<div id="debugBanner" style="display:none; margin:10px 16px; padding:10px 12px; background:#fdecea; border:1px solid #f2b8b5; color:#8a1f11; font-size:12px; border-radius:8px; word-break:break-all;"></div>

<script>
window.addEventListener("error", ev => {
  const b = document.getElementById("debugBanner");
  if (!b) return;
  b.style.display = "block";
  b.textContent = "⚠ 頁面錯誤：" + (ev.message || "未知錯誤") + (ev.filename ? "　來源：" + ev.filename + ":" + ev.lineno + ":" + ev.colno : "");
});

/* =====================================================================
   通關密碼：這只是防止連結被不相干的人手滑亂改，不是真正的資安機制
   （看得到這份原始碼的人都看得到這個密碼）。要換密碼直接改下面這行。
   ===================================================================== */
const STAFF_PIN = "2026";

(function initLock(){
  const lock = document.getElementById("lockScreen");
  const input = document.getElementById("pinInput");
  const btn = document.getElementById("pinBtn");
  const err = document.getElementById("pinErr");
  function tryUnlock(){
    if (input.value === STAFF_PIN) {
      try { localStorage.setItem("staffUnlocked", "1"); } catch(e){}
      lock.style.display = "none";
    } else {
      err.textContent = "密碼不正確，請重新輸入";
      input.value = "";
      input.focus();
    }
  }
  let already = false;
  try { already = localStorage.getItem("staffUnlocked") === "1"; } catch(e){}
  if (already) { lock.style.display = "none"; }
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") tryUnlock(); });
})();

/* ===== Firebase（需要寫入權限，用匿名登入） ===== */

const fbAuth = firebase.auth();

let fbSignedIn = false;
const fbQueue = [];
function fbFlushQueue(){ while (fbQueue.length) fbQueue.shift()(); }
fbAuth.onAuthStateChanged(user => { fbSignedIn = !!user; if (fbSignedIn) fbFlushQueue(); render(); });
fbAuth.signInAnonymously().catch(err => { fbStatus = "offline"; render(); });

let fbStatus = "connecting"; // connecting | live | offline

/* 只寫「這一個欄位」的葉節點，不會動到其他場次/欄位的資料，多裝置同時操作也安全 */
function pushLeaf(path, value){
  const run = () => fbDb.ref(path).set(value).catch(err => { console.warn("寫入失敗", path, err); fbStatus = "offline"; render(); });
  if (fbSignedIn) run(); else fbQueue.push(run);
}

let liveScores = {}, liveFun = {}, liveShoot = {}, liveRefs = {}, liveTimes = {};
/* 記錄「這台裝置剛剛自己改過」的欄位，短時間內不要被剛好慢到的遠端回傳蓋掉，避免畫面閃爍/跳回舊值 */
const recentEdit = {};
function markRecent(key){ recentEdit[key] = Date.now() + 1500; }
function isRecent(key){ return (recentEdit[key] || 0) > Date.now(); }

fbDb.ref("event2026/scores").on("value", snap => {
  const remote = snap.val() || {};
  Object.keys(remote).forEach(id => { if (!isRecent("s:"+id)) liveScores[id] = remote[id]; });
  Object.keys(liveScores).forEach(id => { if (!(id in remote) && !isRecent("s:"+id)) delete liveScores[id]; });
  fbStatus = "live"; render();
}, () => { fbStatus = "offline"; render(); });
fbDb.ref("event2026/fun").on("value", snap => {
  const remote = snap.val() || {};
  Object.keys(remote).forEach(id => { if (!isRecent("f:"+id)) liveFun[id] = remote[id]; });
  render();
}, () => {});
fbDb.ref("event2026/shoot").on("value", snap => {
  const remote = snap.val() || {};
  /* p=預賽、t=預賽加賽、f=決賽、ft=決賽加賽 */
  ["p","t","f","ft"].forEach(kind => {
    const sub = remote[kind] || {};
    if (!liveShoot[kind]) liveShoot[kind] = {};
    Object.keys(sub).forEach(i => { if (!isRecent("sh:"+kind+":"+i)) liveShoot[kind][i] = sub[i]; });
  });
  render();
}, () => {});
/* 裁判資料：只讀顯示，這份檔案沒有任何寫入 event2026/refs 的程式碼，工作人員無法在這裡改裁判 */
fbDb.ref("event2026/refs").on("value", snap => {
  liveRefs = snap.val() || {};
  render();
}, () => {});
/* 比賽時間異動：只讀。主控台若把某場往後延，這裡的「進行中／下一場」才會跟著正確 */
fbDb.ref("event2026/times").on("value", snap => {
  liveTimes = snap.val() || {};
  render();
}, () => {});

function resolveEntrant(e){
  if (!e) return { text:"", ok:false, bye:false };
  if (e.bye) return { text:"輪空", ok:false, bye:true };
  if (e.name) return { text:e.name, ok:true, bye:false };
  if (e.win)  { const w = winnerOf(MATCHES[e.win]); return w ? { text:w, ok:true, bye:false } : { text:phWin(e.win), ok:false, bye:false }; }
  if (e.lose) { const l = loserOf(MATCHES[e.lose]); return l ? { text:l, ok:true, bye:false } : { text:phLose(e.lose), ok:false, bye:false }; }
  return { text:"", ok:false, bye:false };
}
function winnerOf(m){
  if (!m) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  if (m.b && m.b.bye) return A.ok ? A.text : null;
  const s = scoreOf(m.id);

  return (s.a > s.b ? A : B).ok ? (s.a > s.b ? A : B).text : null;

/* ===== 晉級與加賽判定（board.html / staff.html / index.html 共用同一套規則） =====
   欄位：p=預賽得分、t=預賽加賽得分、f=決賽得分、ft=決賽加賽得分
   規則：
   1. 預賽全部登記完，才會產生正式晉級名單；未登記完只顯示灰色「暫定」。
   2. 第 4 名同分不再用名冊順序硬分，改由同分者登記「加賽得分」決定。
      加賽若又同分，把加賽得分清掉重填下一輪即可，看板會持續提示 → 等於可以比到分出為止。
   3. 決賽冠亞季同分同樣用「決賽加賽」分出（第 4 名同分不影響頒獎，直接並列）。 */
const SHOOT_QUOTA = 4;                       // 預賽取前 4 名進總決賽
function shootDoneCount() {
  let n = 0;
  SHOOTERS.forEach((p, i) => { if (shootVal("p", i) !== null) n++; });
  return n;
}
function shootPrelimComplete() { return shootDoneCount() >= SHOOTERS.length; }
/* 預賽依得分分群（同分為一群），分數由高到低：[{v, ids:[選手index]}] */
function shootGroups() {
  const arr = [];
  SHOOTERS.forEach((p, i) => { const v = shootVal("p", i); if (v !== null) arr.push({ i:i, v:v }); });
  arr.sort((a, b) => b.v - a.v || a.i - b.i);
  const gs = [];
  arr.forEach(x => {
    const g = gs[gs.length - 1];
    if (g && g.v === x.v) g.ids.push(x.i); else gs.push({ v:x.v, ids:[x.i] });
  });
  return gs;
}
/* 晉級判定
   { list:晉級者index[]（未登記完時為暫定領先）, locked:是否已定案, complete:預賽是否登記完,
     ranks:{index:名次}, tieIds:卡在最後名額待加賽者[], tieNeed:這群人要搶幾個名額, tieAgain:加賽後仍同分 } */
function shootQualify() {
  const gs = shootGroups();
  const ranks = {};
  let pos = 1;
  gs.forEach(g => { g.ids.forEach(i => { ranks[i] = pos; }); pos += g.ids.length; });
  const out = { list:[], locked:false, complete:shootPrelimComplete(), ranks:ranks, tieIds:[], tieNeed:0, tieAgain:false };
  let need = SHOOT_QUOTA, gi = 0;
  while (gi < gs.length && need > 0 && gs[gi].ids.length <= need) {
    gs[gi].ids.forEach(i => out.list.push(i));
    need -= gs[gi].ids.length;
    gi++;
  }
  if (!out.complete) {                                   // 預賽還沒登記完 → 只給暫定領先，不鎖定
    if (need > 0 && gi < gs.length) gs[gi].ids.slice(0, need).forEach(i => out.list.push(i));
    return out;
  }
  if (need <= 0 || gi >= gs.length) { out.locked = true; return out; }   // 剛好取滿，或報名人數不足 4 人
  const tie = gs[gi];                                    // 卡在最後名額的同分群
  const tv = tie.ids.map(i => ({ i:i, t:shootVal("t", i) }));
  if (tv.some(x => x.t === null)) {                      // 還有人沒登記加賽得分
    out.tieIds = tie.ids.slice(); out.tieNeed = need; return out;
  }
  tv.sort((a, b) => b.t - a.t);
  if (tv[need - 1].t === tv[need].t) {                   // 加賽又同分 → 再比一次
    out.tieIds = tie.ids.slice(); out.tieNeed = need; out.tieAgain = true; return out;
  }
  tv.slice(0, need).forEach(x => out.list.push(x.i));
  out.locked = true;
  return out;
}
/* 沿用舊介面：回傳晉級（或暫定領先）名單 [{i, v}] */
function shootTop4() { const q = shootQualify(); return q.list.map(i => ({ i:i, v:shootVal("p", i) })); }
/* 名單太長時只列前 8 位，避免看板被一長串名字塞爆 */
function shootNameList(ids) {
  const ns = ids.map(i => SHOOTERS[i][1]);
  return ns.length > 8 ? ns.slice(0, 8).join("、") + " …等 " + ns.length + " 人" : ns.join("、");
}
function shootTieNote() {
  const q = shootQualify();
  if (!q.complete) {
    const n = shootDoneCount();
    return n ? "預賽登記中（" + n + "/" + SHOOTERS.length + " 人）：全部登記完才會產生正式晉級名單，未到場者請直接填 0 分" : "";
  }
  if (!q.tieIds.length) return "";
  return (q.tieAgain ? "⚠ 加賽仍同分，請再加賽一次（把加賽得分清掉重填）：" :
                       "⚠ 並列第 " + (q.list.length + 1) + " 名，請現場加賽並登記「加賽得分」：") +
         shootNameList(q.tieIds) + "（" + q.tieIds.length + " 人爭 " + q.tieNeed + " 個名額）";
}
/* 總決賽名次：依決賽得分排序；同分且涉及冠亞季 → 用「決賽加賽」分出，比到分出為止
   { rows:[{i,p,f,ft,rank,tie}], settled:名次全部定案, tieIds:待加賽者, tieAgain:加賽後仍同分 } */
function shootFinalInfo() {
  const q = shootQualify();
  const empty = { rows:[], settled:false, tieIds:[], tieAgain:false, qualify:q };
  if (!q.locked || q.list.length < SHOOT_QUOTA) return empty;
  const arr = q.list.map(i => ({ i:i, p:shootVal("p", i), f:shootVal("f", i), ft:shootVal("ft", i) }));
  if (arr.some(x => x.f === null)) return empty;         // 決賽分數還沒登記完
  arr.sort((a, b) => b.f - a.f);
  const gs = [];
  arr.forEach(x => {
    const g = gs[gs.length - 1];
    if (g && g.f === x.f) g.ids.push(x); else gs.push({ f:x.f, ids:[x] });
  });
  const rows = [], tieIds = [];
  let pos = 1, tieAgain = false;
  gs.forEach(g => {
    if (g.ids.length === 1) { g.ids[0].rank = pos; rows.push(g.ids[0]); pos++; return; }
    if (pos > 3) {                                       // 第 4 名之後同分不影響頒獎 → 直接並列
      g.ids.forEach(x => { x.rank = pos; x.tie = true; rows.push(x); });
      pos += g.ids.length; return;
    }
    if (g.ids.every(x => x.ft !== null)) {               // 加賽得分都填了 → 看能不能分出
      const s = g.ids.slice().sort((a, b) => b.ft - a.ft);
      let dup = false;
      for (let k = 1; k < s.length; k++) if (s[k].ft === s[k - 1].ft) dup = true;
      if (!dup) { s.forEach(x => { x.rank = pos; rows.push(x); pos++; }); return; }
      tieAgain = true;
    }
    g.ids.forEach(x => { x.rank = pos; x.tie = true; rows.push(x); tieIds.push(x.i); });
    pos += g.ids.length;
  });
  return { rows:rows, settled:tieIds.length === 0, tieIds:tieIds, tieAgain:tieAgain, qualify:q };
}
function shootFinalTieNote() {
  const fi = shootFinalInfo();
  if (!fi.rows.length || fi.settled || !fi.tieIds.length) return "";
  return (fi.tieAgain ? "⚠ 決賽加賽仍同分，請再加賽一次（把加賽得分清掉重填）：" :
                        "⚠ 決賽同分，請加賽決定名次並登記「加賽」得分：") + shootNameList(fi.tieIds);
}
/* 沿用舊介面：finalOnly=true 時，名次未全部定案就回傳空陣列（冠亞季只在定案後才公布） */
function shootRank(finalOnly) {
  const fi = shootFinalInfo();
  if (!fi.rows.length) return [];
  if (finalOnly && !fi.settled) return [];
  return fi.rows;
}

let state = { view:"schedule", s:"all", q:"", sq:"", sf:"all" };

/* ===== 進行中／下一場（規則與主控版 board.html、手機看板 index.html 完全一致） ===== */
let nowMin = 0;
const MATCH_LIST = Object.keys(MATCHES).map(k => MATCHES[k]);
function getTime(m){ return (liveTimes && liveTimes[m.id]) || m.t; }
function parseRange(t){
  const x = /^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  return x ? { a:(+x[1])*60+(+x[2]), b:(+x[3])*60+(+x[4]) } : null;
}
function isReady(m){
  return (resolveEntrant(m.a).ok || (m.a && m.a.bye)) && (resolveEntrant(m.b).ok || (m.b && m.b.bye));
}
let liveIds = {}, nextIds = {};
function computeVenueState(){
  // 每個場地只讓「開賽時間最早」且已開賽、未完賽的一場顯示進行中
  const liveByVenue = {};
  MATCH_LIST.forEach(m => {
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m) || !isReady(m)) return;
    if (nowMin < r.a) return;                          // 尚未開賽
    const v = m.v || "_";
    const cur = liveByVenue[v];
    if (!cur || r.a < cur.r.a) liveByVenue[v] = { m:m, r:r };
  });
  liveIds = {};
  Object.keys(liveByVenue).forEach(v => { liveIds[liveByVenue[v].m.id] = liveByVenue[v].r; });
  // 下一場：同場地中，排在進行中那場之後、時間最早的未完賽場次
  nextIds = {};
  Object.keys(liveByVenue).forEach(v => {
    const cur = liveByVenue[v];
    let best = null;
    MATCH_LIST.forEach(m => {
      if (m.id === cur.m.id || (m.v || "_") !== v) return;
      const r = parseRange(getTime(m));
      if (!r || winnerOf(m)) return;
      if (r.a < cur.r.a) return;                       // 早於進行中那場的不算
      if (r.a === cur.r.a && m.id <= cur.m.id) return; // 同時段取後者
      if (!best || r.a < best.r.a) best = { m:m, r:r };
    });
    if (best) nextIds[best.m.id] = true;
  });
  // 該場地尚無進行中場次時：取該場地最早的未完賽場次為下一場
  const venues = {};
  MATCH_LIST.forEach(m => {
    const v = m.v || "_";
    if (liveByVenue[v]) return;
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m)) return;
    if (!venues[v] || r.a < venues[v].r.a) venues[v] = { m:m, r:r };
  });
  Object.keys(venues).forEach(v => { nextIds[venues[v].m.id] = true; });
}
function matchPhase(m){
  if (liveIds[m.id]) { const r = liveIds[m.id]; return (r && nowMin > r.b) ? "live over" : "live"; }
  return nextIds[m.id] ? "next" : "";
}
/* 選手名稱：勝者名字後面掛獎盃 */
function pnameHTML(side, winnerText){
  const isWin = winnerText && side.ok && side.text === winnerText;
  return '<span class="pname"><span class="pntxt">' + esc(side.text) + '</span>' +
         (isWin ? '<span class="pnwin">🏆</span>' : "") + '</span>';
}

/* ===== 共用：數字加減器（可以直接點兩側按鈕，也可以直接點數字輸入） ===== */
function stepperHTML(kind, key, sub, val){
  const v = (val === null || val === undefined) ? "" : val;
  return '<div class="stepper" data-kind="' + kind + '" data-key="' + key + '" data-sub="' + sub + '">' +
    '<button class="stepbtn" data-op="-">－</button>' +
    '<input class="stepval" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="' + esc(v) + '">' +
    '<button class="stepbtn" data-op="+">＋</button>' +
  '</div>';
}

/* 更新投籃「前 4 名」按鈕上的人數 */
function updateShootChipCount(){
  const el = document.querySelector('#shootChips .chip[data-sf="top4"]');
  if (!el) return;
  const q = shootQualify();
  const n = q.list.length + q.tieIds.length;
  el.innerHTML = "🏆 前 4 名" + (n ? '<span class="cnt">' + n + '</span>' : "");
}

/* 更新「進行中／下一場」按鈕上的場次數量 */
function updateChipCounts(){
  let live = 0, next = 0;
  MATCH_LIST.forEach(m => {
    if (m.b && m.b.bye) return;
    if (scoreOf(m.id) !== null) return;
    const ph = matchPhase(m);
    if (ph.indexOf("live") === 0) live++;
    else if (ph === "next") next++;
  });
  const set = (sel, n) => {
    const el = document.querySelector('#chips .chip[data-s="' + sel + '"]');
    if (!el) return;
    el.innerHTML = (sel === "live" ? "● 進行中" : "○ 下一場") + (n ? '<span class="cnt">' + n + '</span>' : "");
  };
  set("live", live); set("next", next);
}

/* ===== 賽程比分 ===== */
function renderSchedule(){
  const q = state.q.trim().toLowerCase();
  const list = Object.keys(MATCHES).map(k => MATCHES[k]).filter(m => !(m.b && m.b.bye));
  const filtered = list.filter(m => {
    if (state.s === "live" || state.s === "next") {
      // 已輸入比分的場次不再視為進行中／下一場，與卡片右上角的標示一致
      if (scoreOf(m.id) !== null) return false;
      const ph = matchPhase(m);
      if (state.s === "live" && ph.indexOf("live") !== 0) return false;
      if (state.s === "next" && ph !== "next") return false;
    }
    else if (state.s !== "all" && m.sport !== state.s) return false;
    if (!q) return true;
    const A = resolveEntrant(m.a).text, B = resolveEntrant(m.b).text;
    return ((m.gname + " " + m.lb).toLowerCase() + " " + searchKeysOf(A) + " " + searchKeysOf(B)).indexOf(q) >= 0;
  });
  if (!filtered.length) {
    if (state.s === "live") return '<div class="empty">目前沒有進行中的場次<br><span style="font-size:12.5px">賽事還沒開始，或這個時段剛好都輸入完了</span></div>';
    if (state.s === "next") return '<div class="empty">目前沒有排定的下一場</div>';
    return '<div class="empty">找不到符合的場次</div>';
  }
  let html = "";
  filtered.forEach(m => {
    const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
    const s = liveScores[m.id] || {};
    const done = scoreOf(m.id) !== null;
    const ref = liveRefs[m.id] || "";
    const w = winnerOf(m);
    const t = getTime(m);
    // 已輸入比分的場次不再標進行中／下一場，右上角改顯示「已輸入」
    const phase = done ? "" : matchPhase(m);
    const over = phase.indexOf("over") >= 0;
    const rightTag = done ? '<span class="savedtag">✓ 已輸入</span>'
      : phase.indexOf("live") === 0 ? '<span class="phasetag live' + (over ? " over" : "") + '">● 進行中' + (over ? "！" : "") + '</span>'
      : phase === "next" ? '<span class="phasetag next">○ 下一場</span>' : "";
    html += '<div class="card ' + m.sport + " g-" + m.group + (done ? " qual" : "") + (phase ? " " + phase : "") + '">' +
      '<div class="ctop"><span class="tag">' + SPORT_LABEL[m.sport] + ' · ' + esc(m.gname) + ' ' + esc(m.lb) + '</span>' + rightTag + '</div>' +
      '<div class="cvenue">' + (t && t !== "—" ? esc(t) + "　" : "") + (VENUE_LABEL[m.v] || esc(m.v||"")) + (ref ? '　🚩 裁判　<b>' + esc(ref) + '</b>' : "") + '</div>' +
      '<div class="scorerow">' + pnameHTML(A, w) + stepperHTML("score", m.id, "a", s.a) + '</div>' +
      '<div class="scorerow">' + pnameHTML(B, w) + stepperHTML("score", m.id, "b", s.b) + '</div>' +
      '<div class="cardfoot"><span class="clearlink" data-clear="score" data-key="' + m.id + '">清除這場比分</span></div>' +
    '</div>';
  });
  return html;
}

/* ===== 趣味競賽 ===== */
function renderFun(){
  let html = "";
  FUN_EVENTS.forEach(e => {
    const f = liveFun[e.id] || {};
    const done = funScore(e.id) !== null;
    const sc = funScore(e.id);
    const rw = sc && sc.r > sc.w, ww = sc && sc.w > sc.r;
    const winTag = '<span class="fwin">（勝）🏆</span>';
    html += '<div class="card' + (done ? " qual" : "") + '">' +
      '<div class="ctop"><span class="tag">' + esc(e.name) + '</span>' + (done ? '<span class="savedtag">✓ 已輸入</span>' : "") + '</div>' +
      '<div class="scorerow"><span class="pname"><span class="pntxt">🔴 紅隊</span>' + (rw ? winTag : "") + '</span>' + stepperHTML("fun", e.id, "r", f.r) + '</div>' +
      '<div class="scorerow"><span class="pname"><span class="pntxt">⚪ 白隊</span>' + (ww ? winTag : "") + '</span>' + stepperHTML("fun", e.id, "w", f.w) + '</div>' +
      '<div class="cardfoot"><span class="clearlink" data-clear="fun" data-key="' + e.id + '">清除這項比分</span></div>' +
    '</div>';
  });
  return html;
}

/* ===== 投籃大賽 ===== */
function renderShoot(){
  const q = shootQualify();
  const fi = shootFinalInfo();
  const pos = {}; q.list.forEach((i, k) => { pos[i] = k + 1; });
  const tieSet = {}; q.tieIds.forEach(i => { tieSet[i] = 1; });
  const finTie = {}; fi.tieIds.forEach(i => { finTie[i] = 1; });
  const sq = state.sq.trim().toLowerCase();
  // 晉級名次一律以全體 29 人的預賽成績計算，搜尋與篩選只影響「顯示哪幾張卡片」
  const inTop = i => !!pos[i] || !!tieSet[i];
  const hits = SHOOTERS.map((p, i) => i).filter(i => {
    if (state.sf === "top4" && !inTop(i)) return false;
    if (!sq) return true;
    const p = SHOOTERS[i];
    return (p[0] + " " + p[1] + " " + p[2] + " " + searchKeysOf(p[1])).toLowerCase().indexOf(sq) >= 0;
  });
  // 只看前 4 名時，改用名次排序（預設是名冊順序，看不出誰第幾名）
  if (state.sf === "top4") hits.sort((a, b) => (pos[a] || 98) - (pos[b] || 98) || a - b);

  const doneN = shootDoneCount();
  let hint = "預賽取前 4 名進總決賽；決賽分數只有晉級者需要填。";
  if (!q.complete) hint = "預賽登記中（" + doneN + "/" + SHOOTERS.length + " 人）。⚠ 全部登記完才會產生正式晉級名單，未到場者請直接填 0 分。";
  let html = '<div class="empty" style="padding:10px 4px;text-align:left;color:var(--sub);font-size:12.5px">' + esc(hint) + '</div>';
  const note = q.complete ? shootTieNote() : "";
  const fnote = shootFinalTieNote();
  const banner = t => '<div class="tiebar">' + esc(t) + '</div>';
  if (note) html += banner(note);
  if (fnote) html += banner(fnote);
  if (!hits.length) {
    if (state.sf === "top4" && !q.list.length && !q.tieIds.length) return html + '<div class="empty">尚無預賽成績<br><span style="font-size:12.5px">要先輸入預賽得分，才排得出前 4 名</span></div>';
    if (state.sf === "top4") return html + '<div class="empty">前 4 名裡找不到符合的選手</div>';
    return html + '<div class="empty">找不到符合的選手</div>';
  }
  hits.forEach(i => {
    const p = SHOOTERS[i];
    const qualified = q.locked && pos[i];
    const inTie = !!tieSet[i];
    const tag = qualified ? '<span class="qualtag">晉級 ' + pos[i] + '</span>'
      : inTie ? '<span class="qualtag tie">並列・待加賽</span>'
      : (!q.complete && pos[i]) ? '<span class="qualtag pend">暫定 ' + pos[i] + '</span>' : "";
    html += '<div class="card' + (qualified ? " qual" : inTie ? " tiecard" : "") + '">' +
      '<div class="ctop"><span class="tag">' + esc(p[1]) + '　<span style="color:var(--sub);font-weight:600">' + esc(p[0]) + '</span></span>' + tag + '</div>' +
      '<div class="scorerow"><span class="pname">預賽得分</span>' + stepperHTML("shootp", i, "p", shootVal("p", i)) + '</div>' +
      // 卡在晉級線上的同分者才需要「預賽加賽」
      (inTie || shootVal("t", i) !== null ?
        '<div class="scorerow"><span class="pname">預賽加賽得分</span>' + stepperHTML("shoott", i, "t", shootVal("t", i)) + '</div>' : "") +
      (qualified ? '<div class="scorerow"><span class="pname">決賽得分</span>' + stepperHTML("shootf", i, "f", shootVal("f", i)) + '</div>' : "") +
      // 決賽冠亞季同分時才需要「決賽加賽」
      (qualified && (finTie[i] || shootVal("ft", i) !== null) ?
        '<div class="scorerow"><span class="pname">決賽加賽得分</span>' + stepperHTML("shootft", i, "ft", shootVal("ft", i)) + '</div>' : "") +
      '<div class="cardfoot"><span class="clearlink" data-clear="shoot" data-key="' + i + '">清除這位選手的分數</span></div>' +
    '</div>';
  });
  return html;
}

function render(){
  const now = new Date();
  nowMin = now.getHours() * 60 + now.getMinutes();
  computeVenueState();
  updateChipCounts();
  updateShootChipCount();
  const main = document.getElementById("main");
  if (state.view === "schedule") main.innerHTML = renderSchedule();
  else if (state.view === "fun") main.innerHTML = renderFun();
  else main.innerHTML = renderShoot();

  const statusText = fbStatus === "live" ? "🟢 已連線，比分即時同步" : fbStatus === "offline" ? "🔴 連線中斷，請檢查網路" : "🟡 連線中…";
  document.getElementById("updated").textContent = statusText;
  document.getElementById("verline").textContent = "經貿 X 經采 EWC　© 2026 EWC · v" + APP_VER;
}

/* ===== 共用：讀取／寫入某個計分欄位的目前值 ===== */
function getStepValue(kind, key, sub){
  if (kind === "score") { const cur = liveScores[key] || {}; return cur[sub]; }
  if (kind === "fun") { const cur = liveFun[key] || {}; return cur[sub]; }
  if (SHOOT_KIND[kind]) return (liveShoot[SHOOT_KIND[kind]] || {})[key];
}
function setStepValue(kind, key, sub, v){
  if (kind === "score") {
    const cur = liveScores[key] || {};
    liveScores[key] = Object.assign({}, cur); liveScores[key][sub] = v;
    markRecent("s:"+key);
    pushLeaf("event2026/scores/" + key + "/" + sub, v);
  } else if (kind === "fun") {
    const cur = liveFun[key] || {};
    liveFun[key] = Object.assign({}, cur); liveFun[key][sub] = v;
    markRecent("f:"+key);
    pushLeaf("event2026/fun/" + key + "/" + sub, v);
  } else if (SHOOT_KIND[kind]) {
    const k = SHOOT_KIND[kind];
    if (!liveShoot[k]) liveShoot[k] = {};
    liveShoot[k][key] = v;
    markRecent("sh:"+k+":"+key);
    pushLeaf("event2026/shoot/" + k + "/" + key, v);
  }
}
/* 把使用者直接打的字串，轉成合法的分數值（非負整數）；打不出數字就當作清空 */
function parseTypedScore(raw){
  raw = String(raw).trim();
  if (raw === "") return "";
  const n = Math.floor(Number(raw));
  return (isNaN(n) || n < 0) ? "" : n;
}

/* ===== 加減按鈕、直接輸入與清除連結事件（用事件代理，畫面會一直重繪） ===== */
document.getElementById("main").addEventListener("click", ev => {
  const clearEl = ev.target.closest("[data-clear]");
  if (clearEl) {
    const kind = clearEl.getAttribute("data-clear"), key = clearEl.getAttribute("data-key");
    if (!confirm("確定清除這筆分數？")) return;
    if (kind === "score") {
      pushLeaf("event2026/scores/" + key + "/a", "");
      pushLeaf("event2026/scores/" + key + "/b", "");
      liveScores[key] = { a:"", b:"" }; markRecent("s:"+key);
    } else if (kind === "fun") {
      pushLeaf("event2026/fun/" + key + "/r", "");
      pushLeaf("event2026/fun/" + key + "/w", "");
      liveFun[key] = { r:"", w:"" }; markRecent("f:"+key);
    } else if (kind === "shoot") {
      ["p","t","f","ft"].forEach(k => {
        pushLeaf("event2026/shoot/" + k + "/" + key, "");
        if (!liveShoot[k]) liveShoot[k] = {};
        liveShoot[k][key] = "";
        markRecent("sh:"+k+":"+key);
      });
    }
    render();
    return;
  }
  const btn = ev.target.closest(".stepbtn");
  if (!btn) return;
  const wrap = btn.closest(".stepper");
  const kind = wrap.getAttribute("data-kind"), key = wrap.getAttribute("data-key"), sub = wrap.getAttribute("data-sub");
  const op = btn.getAttribute("data-op");

  const raw = getStepValue(kind, key, sub);
  let v = (raw === "" || raw == null) ? -1 : Number(raw);
  v = op === "+" ? v + 1 : Math.max(0, v - 1);
  setStepValue(kind, key, sub, v);
  render();
});
/* 直接點數字輸入打字：打完離開欄位（或按完成／Enter）才送出，避免每打一個字就送一次 */
document.getElementById("main").addEventListener("change", ev => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains("stepval")) return;
  const wrap = el.closest(".stepper");
  const kind = wrap.getAttribute("data-kind"), key = wrap.getAttribute("data-key"), sub = wrap.getAttribute("data-sub");
  const v = parseTypedScore(el.value);
  setStepValue(kind, key, sub, v);
  render();
});


document.getElementById("nav").addEventListener("click", ev => {
  const t = ev.target.closest(".navtab");
  if (!t) return;
  document.querySelectorAll(".navtab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.view = t.getAttribute("data-v");
  document.getElementById("scheduleControls").style.display = state.view === "schedule" ? "" : "none";
  document.getElementById("shootControls").style.display = state.view === "shoot" ? "" : "none";
  render();
});
document.getElementById("chips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.s = c.getAttribute("data-s");
  render();
});
document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });
document.getElementById("sq").addEventListener("input", ev => { state.sq = ev.target.value; render(); });
document.getElementById("shootChips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#shootChips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.sf = c.getAttribute("data-sf");
  render();
});

/* 每 30 秒重畫一次，讓「進行中／下一場」跟著時間走。
   有人正在輸入比分（或正在打搜尋關鍵字）時跳過，避免手上的欄位被重繪打斷。 */
setInterval(() => {
  if (state.view !== "schedule") return;
  const el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
  render();
}, 30000);

render();
</script>
